name: risk-metrics-validation

on:
  push:
    branches: ["feature/phase3.9-risk-metrics"]

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: trading_engine
          POSTGRES_PASSWORD: trading_engine
          POSTGRES_DB: trading_engine_test
        options: >-
          --health-cmd "pg_isready -U trading_engine -d trading_engine_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      TRADING_ENGINE_TEST_DATABASE_URL: postgresql://trading_engine:trading_engine@127.0.0.1:5432/trading_engine_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: analytics-py
        run: python -m pip install -e ".[dev]"
      - name: Focused risk metrics tests
        working-directory: analytics-py
        run: python -m pytest -q tests/unit/observability/test_risk_metrics.py tests/unit/application/test_risk_metrics.py

  full:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: trading_engine
          POSTGRES_PASSWORD: trading_engine
          POSTGRES_DB: trading_engine_test
        options: >-
          --health-cmd "pg_isready -U trading_engine -d trading_engine_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      TRADING_ENGINE_TEST_DATABASE_URL: postgresql://trading_engine:trading_engine@127.0.0.1:5432/trading_engine_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: analytics-py
        run: python -m pip install -e ".[dev]"
      - name: Full test suite
        working-directory: analytics-py
        run: python -m pytest -q
