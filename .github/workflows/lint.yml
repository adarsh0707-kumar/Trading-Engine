name: lint

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  workflow-lint:
    name: GitHub Actions workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install actionlint
        run: |
          ACTIONLINT_VERSION="1.7.7"
          curl -sSfL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" -o /tmp/actionlint.tar.gz
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          sudo install /tmp/actionlint /usr/local/bin/actionlint
      - name: Check workflow syntax and expressions
        run: actionlint .github/workflows/*.yml

  whitespace:
    name: Patch whitespace validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check patch whitespace
        run: git diff --check
