name: Microsoft C++ Code Analysis

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: '25 5 * * 2'

env:
  # Path to the CMake build directory.
  build: '${{ github.workspace }}/build'

permissions:
  contents: read

jobs:
  analyze:
    permissions:
      contents: read
      security-events: write
      actions: read

    name: Analyze
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B ${{ env.build }} -DENABLE_NETWORKING=OFF

      # Build is not required unless generated source files are used
      # - name: Build CMake
      #   run: cmake --build ${{ env.build }}

      - name: Initialize MSVC Code Analysis
        uses: microsoft/msvc-code-analysis-action@04825f6d9e00f87422d6bf04e1a38b1f3ed60d99
        id: run-analysis
        with:
          cmakeBuildDirectory: ${{ env.build }}
          ruleset: NativeRecommendedRules.ruleset

      - name: Normalize MSVC SARIF
        shell: pwsh
        run: |
          $sarifPath = "${{ steps.run-analysis.outputs.sarif }}"
          $sarif = Get-Content -Raw $sarifPath | ConvertFrom-Json

          if ($sarif.runs.Count -eq 0) {
              throw "MSVC Code Analysis produced a SARIF file with no runs."
          }

          $runsWithResults = @(
              $sarif.runs | Where-Object {
                  $_.results -and $_.results.Count -gt 0
              }
          )

          if ($runsWithResults.Count -gt 0) {
              throw "MSVC SARIF contains $($runsWithResults.Count) runs with results. Do not discard findings."
          }

          Write-Host "MSVC SARIF contains $($sarif.runs.Count) empty runs."
          Write-Host "Normalizing to a single empty PREfast run."

          $sarif.runs = @($sarif.runs[0])

          $sarif | ConvertTo-Json -Depth 100 | Set-Content -Path $sarifPath -Encoding utf8

          Write-Host "Normalized SARIF runs: $($sarif.runs.Count)"

      - name: Upload SARIF to GitHub
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.run-analysis.outputs.sarif }}
          category: msvc-code-analysis
          
