name: test

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  engine-cpp:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S engine-cpp -B engine-cpp/build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build engine-cpp/build -j"$(nproc)"

      - name: Test
        working-directory: engine-cpp/build
        run: ctest --output-on-failure

  analytics-py:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        working-directory: analytics-py
        run: python -m pip install -e ".[dev]"

      - name: Test
        working-directory: analytics-py
        run: python -m pytest -q
