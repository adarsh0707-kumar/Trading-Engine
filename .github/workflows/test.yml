name: test

permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  engine-cpp:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S engine-cpp -B engine-cpp/build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build engine-cpp/build -j"$(nproc)"

      - name: Test
        working-directory: engine-cpp/build
        run: ctest --output-on-failure

  analytics-py:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: trading_engine
          POSTGRES_PASSWORD: trading_engine
          POSTGRES_DB: trading_engine_test
        options: >-
          --health-cmd "pg_isready -U trading_engine -d trading_engine_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    env:
      TRADING_ENGINE_TEST_DATABASE_URL: postgresql://trading_engine:trading_engine@127.0.0.1:5432/trading_engine_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        working-directory: analytics-py
        run: python -m pip install -e ".[dev]"

      - name: Test
        working-directory: analytics-py
        run: python -m pytest -q

  gateway-node:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install
        working-directory: gateway-node
        run: bun install --frozen-lockfile

      - name: Build
        working-directory: gateway-node
        run: bun run build

      - name: Security regression suite
        working-directory: gateway-node
        run: bun run test:security

      - name: Full Gateway test suite
        working-directory: gateway-node
        run: bun test

      - name: Full-stack Gateway integration
        working-directory: gateway-node
        run: bun run test:integration

  runtime-integration:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install Gateway dependencies
        working-directory: gateway-node
        run: bun install --frozen-lockfile

      - name: Start real Phase 4 runtime stack
        env:
          ENGINE_RISK_MAX_DRAWDOWN: "100000000"
          ENGINE_RISK_MAX_DAILY_LOSS: "100000000"
        run: docker compose up -d --build

      - name: Wait for runtime readiness
        run: |
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/api/health >/dev/null; then
              exit 0
            fi

            sleep 2
          done

          docker compose ps
          docker compose logs --no-color
          exit 1

      - name: Real Engine → Analytics → Gateway smoke test
        working-directory: gateway-node
        run: RUN_RUNTIME_INTEGRATION=true bun test tests/runtime-stack.integration.test.ts

      - name: Verify PostgreSQL persistence
        run: |
          for attempt in $(seq 1 30); do
            analytics_count="$(docker compose exec -T analytics python -c '
          import os
          import psycopg

          with psycopg.connect(os.environ["TRADING_ENGINE_DATABASE_URL"]) as conn:
              print(conn.execute(
                  "SELECT COUNT(*) FROM public.trades"
              ).fetchone()[0])
          ')"

            postgres_count="$(docker compose exec -T postgres psql \
              -U trading_engine \
              -d trading_engine \
              -tAc 'SELECT COUNT(*) FROM public.trades;')"

            echo "Persisted trades from analytics connection (attempt $attempt): $analytics_count"
            echo "Persisted trades from postgres container (attempt $attempt): $postgres_count"

            if [ "$analytics_count" -gt 0 ] && [ "$postgres_count" -gt 0 ]; then
              exit 0
            fi

            sleep 1
          done

          echo "=== Analytics PostgreSQL identity ==="

          docker compose exec -T analytics python -c '
          import os
          import psycopg

          with psycopg.connect(os.environ["TRADING_ENGINE_DATABASE_URL"]) as conn:
              print(conn.execute(
                  "SELECT current_database(), current_user, current_schema(), "
                  "inet_server_addr(), inet_server_port()"
              ).fetchone())

              print(
                  "trades:",
                  conn.execute(
                      "SELECT COUNT(*) FROM public.trades"
                  ).fetchone()[0]
              )
          '

          echo "=== PostgreSQL container identity ==="

          docker compose exec -T postgres psql \
            -U trading_engine \
            -d trading_engine \
            -c 'SELECT current_database(), current_user, current_schema(), inet_server_addr(), inet_server_port();'

          echo "=== Analytics logs ==="

          docker compose logs --no-color analytics

          exit 1

      - name: Runtime stack logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop real Phase 4 runtime stack
        if: always()
        run: docker compose down -v

  observability:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate Prometheus configuration
        run: |
          docker run --rm \
            --entrypoint promtool \
            -v "${{ github.workspace }}/infra/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v2.55.1 \
            check config /etc/prometheus/prometheus.yml

      - name: Validate Prometheus alert rules
        run: |
          docker run --rm \
            --entrypoint promtool \
            -v "${{ github.workspace }}/infra/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v2.55.1 \
            check rules /etc/prometheus/alerts.yml
