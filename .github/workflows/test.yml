name: test

permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  engine-cpp:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S engine-cpp -B engine-cpp/build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build engine-cpp/build -j"$(nproc)"

      - name: Test
        working-directory: engine-cpp/build
        run: ctest --output-on-failure

  analytics-py:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: trading_engine
          POSTGRES_PASSWORD: trading_engine
          POSTGRES_DB: trading_engine_test
        options: >-
          --health-cmd "pg_isready -U trading_engine -d trading_engine_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    env:
      TRADING_ENGINE_TEST_DATABASE_URL: postgresql://trading_engine:trading_engine@127.0.0.1:5432/trading_engine_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        working-directory: analytics-py
        run: python -m pip install -e ".[dev]"

      - name: Test
        working-directory: analytics-py
        run: python -m pytest -q

  gateway-node:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install
        working-directory: gateway-node
        run: bun install --frozen-lockfile

      - name: Build
        working-directory: gateway-node
        run: bun run build

      - name: Security regression suite
        working-directory: gateway-node
        run: bun run test:security

      - name: Full Gateway test suite
        working-directory: gateway-node
        run: bun test

  observability:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate Prometheus configuration
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/infra/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v2.55.1 \
            promtool check config /etc/prometheus/prometheus.yml

      - name: Validate Prometheus alert rules
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/infra/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v2.55.1 \
            promtool check rules /etc/prometheus/alerts.yml
