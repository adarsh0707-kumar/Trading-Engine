global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: trading-engine-gateway
    metrics_path: /metrics
    static_configs:
      - targets:
          - gateway:8080
        labels:
          service: gateway

  - job_name: trading-engine-analytics
    metrics_path: /metrics
    static_configs:
      - targets:
          - analytics:9101
        labels:
          service: analytics
