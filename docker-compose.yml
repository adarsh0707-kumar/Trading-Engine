services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: trading_engine
      POSTGRES_PASSWORD: trading_engine
      POSTGRES_DB: trading_engine
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - trading-engine-postgres:/var/lib/postgresql/data
      - ./analytics-py/docker/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading_engine -d trading_engine"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  engine:
    build:
      context: ./engine-cpp
      dockerfile: Dockerfile
    environment:
      ENGINE_BIND_ADDRESS: 0.0.0.0
    ports:
      - "${ENGINE_PORT:-9000}:9000"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9000"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  analytics:
    build:
      context: ./analytics-py
      dockerfile: Dockerfile
    environment:
      ANALYTICS_GATEWAY_HOST: 0.0.0.0
      ANALYTICS_GATEWAY_PORT: 8000
      TRADING_ENGINE_DATABASE_URL: postgresql://trading_engine:trading_engine@postgres:5432/trading_engine
      TRADING_ENGINE_METRICS_HOST: 0.0.0.0
      TRADING_ENGINE_METRICS_PORT: 9101
      TRADING_ENGINE_LOG_LEVEL: INFO
    ports:
      - "${ANALYTICS_METRICS_PORT:-9101}:9101"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9101/metrics', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  gateway:
    build:
      context: ./gateway-node
      dockerfile: Dockerfile
    environment:
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: 8080
      ENGINE_HOST: engine
      ENGINE_PORT: 9000
      ANALYTICS_HOST: analytics
      ANALYTICS_PORT: 8000
      CORS_ORIGINS: ${GATEWAY_CORS_ORIGINS:-http://localhost:5173}
      RATE_LIMIT_ENABLED: "true"
      AUTH_ENABLED: "false"
      AUTH_ENFORCEMENT_ENABLED: "false"
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      engine:
        condition: service_healthy
      analytics:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:8080/api/ready').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard-react
      dockerfile: Dockerfile
      args:
        VITE_GATEWAY_BASE_URL: ${DASHBOARD_GATEWAY_URL:-http://localhost:8080}
        VITE_GATEWAY_WS_URL: ${DASHBOARD_GATEWAY_WS_URL:-ws://localhost:8080}
    ports:
      - "${DASHBOARD_PORT:-5173}:80"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  trading-engine-postgres:
